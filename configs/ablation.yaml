# Ablation study configuration. Mirrors experiments/run_ablation.py.
experiment: ablation
problems: [FDA1, FDA3, FDA4]
tau_t: 25
n_t: 20
population_size: 100
n_gen: 300
seeds: "0-29"
variants:
  full: "standard LDMT-NSGA-II (70/20/10, alpha=1.0)"
  no_feature_simplification: "GMM/covariance distribution description instead of mean-std, keep transfer+lambda"
  no_transfer: "feature extraction kept but no center/scale mapping, reuse prev pop + random response"
code_version: v1.0
out_dir: results/raw
