# Ablation study (v3.2) -- authoritative definition.
#
# Variants disable ONE component of LDT-NSGA-II at a time so the contribution of
# each is measurable.  These names match experiments/run_ablation.py exactly.
#
# "full" is the complete method.  A/B/C switch off trend extrapolation,
# distribution transfer, and old-population retention respectively.

name: 消融实验
description: 逐个关闭 LDT 组件，定位各组件贡献

problems: [FDA1, FDA3, FDA4]
taus: [25]
seeds: "0-29"

algorithms: [ldt_nsga2, ldt_ablation_a, ldt_ablation_b, ldt_ablation_c]
algo_kwargs: {}

N: 100
n_gen: 300
n_t: 20

out: results/raw
experiment_group: ablation
code_version: v3.2

variants:
  full: "完整 LDT-NSGA-II（alpha=0.5，50/20/30）"
  A: "关闭趋势外推（alpha=0）"
  B: "关闭分布迁移（迁移个体改为均匀随机）"
  C: "关闭旧解保留（kappa=0）"
