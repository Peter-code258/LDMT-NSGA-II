# Main comparison experiment configuration.
# Problems x tau_t x algorithms x seeds. Mirrors experiments/run_comparison.py.
experiment: comparison
problems: [FDA1, FDA3, FDA4]
tau_t_values: [10, 25, 50]
n_t: 20
population_size: 100        # N
n_gen: 300
algorithms: [DNSGA2, AR_NSGA2, GMM_Transfer, LDMT_NSGA2]
seeds: "0-29"               # 30 seeds
code_version: v1.0
metrics: [IGD, HV, generation_runtime_s, migration_runtime_s]
out_dir: results/raw
notes: >
  Resumable: skips (problem,tau,algo,seed) combos already present in the
  output CSV. A fresh NSGA2 instance is created each environment segment,
  seeded run_seed+env_index.
