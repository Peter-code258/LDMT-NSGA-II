# Sensitivity study configuration. Mirrors experiments/run_sensitivity.py.
experiment: sensitivity
algorithm: LDMT_NSGA2
problem: FDA3
tau_t: 25
n_gen: 300
seeds: "0-29"
studies:
  - name: population_size
    variable: N
    values: [50, 100, 150]
    fixed_n_t: 20
  - name: environment_resolution
    variable: n_t
    values: [10, 20, 40]
    fixed_N: 100
code_version: v1.0
out_dir: results/raw
